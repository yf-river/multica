<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>代码仓库 · Multica</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<svg class="svg-defs" aria-hidden="true"><defs>
<symbol id="i-repo" viewBox="0 0 24 24"><path d="M5 3h14v18H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z M3 17h16 M7 7h8 M7 11h5"/></symbol>
<symbol id="i-branch" viewBox="0 0 24 24"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="6" r="2"/><path d="M6 7v10M18 8c0 6-12 2-12 8"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5 7a8 8 0 0 1 14 0M19 17a8 8 0 0 1-14 0"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="m10 13 4-4M8 16l-1 1a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0M16 8l1-1a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0" transform="translate(1 1) scale(.9)"/></symbol>
<symbol id="i-github" viewBox="0 0 24 24"><path d="M9 19c-5 1-5-3-7-3m14 6v-4a3 3 0 0 0-1-2c4 0 7-2 7-6a5 5 0 0 0-1-4c0-1 0-3-1-4-2 0-3 1-4 2a13 13 0 0 0-7 0C8 3 6 2 4 2c-1 1-1 3-1 4a5 5 0 0 0-1 4c0 4 3 6 7 6a3 3 0 0 0-1 2v4" transform="translate(1 0) scale(.9)"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z m-4 9 3 3 5-6"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14A9 9 0 0 1 10 3a9 9 0 1 0 10 11Z"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V3H3v13h5"/></symbol>
</defs></svg>
<div class="shell">
<aside class="sidebar">
<a class="brand" href="#"><span class="brand-mark" aria-hidden="true">M</span><strong>Multica</strong></a>
<div class="workspace"><span class="avatar">I</span><div><strong>IDA 工作区</strong><small>个人工作空间</small></div></div>
<p class="eyebrow">工作区设置</p>
<nav aria-label="设置导航"><button data-action="guide" data-target="工作区设置">工作区</button><button data-action="guide" data-target="成员管理">成员</button><button class="nav-selected" aria-current="page"><svg><use href="#i-repo"/></svg>代码仓库</button><button data-action="credentials"><svg><use href="#i-shield"/></svg>连接与凭据</button><button data-action="guide" data-target="运行环境">运行环境</button></nav>
<div class="sidebar-bottom"><span class="avatar small">Y</span><span>我的工作区</span><button class="icon-button" data-action="theme" aria-label="切换浅色或深色模式"><svg><use href="#i-moon"/></svg></button></div>
</aside>
<main>
<div class="breadcrumb">设置 <span>/</span> <strong>代码仓库</strong><button class="icon-button mobile-theme" data-action="theme" aria-label="切换浅色或深色模式"><svg><use href="#i-moon"/></svg></button></div>
<div class="page-content">
<header class="page-header"><div><div class="eyebrow">CODE REPOSITORIES</div><h1>代码仓库</h1><p>把代码来源连接起来，让智能体在各个运行环境中开始工作。</p></div><button class="primary" id="add" data-action="add"><svg><use href="#i-plus"/></svg>添加仓库</button></header>
<section class="connections" aria-label="平台连接"><div class="connection"><span class="provider github"><svg><use href="#i-github"/></svg></span><div><strong>GitHub <span class="subtle">/ ida-team</span></strong><small id="gh-caption">GitHub App · 可访问 4 个仓库</small></div><span class="status ok" id="gh-status">已连接</span><button class="icon-button" data-action="credentials" data-provider="github" aria-label="查看 GitHub 连接"><svg><use href="#i-arrow"/></svg></button></div><div class="connection"><span class="provider gongfeng"><svg><use href="#i-repo"/></svg></span><div><strong>腾讯工蜂 <span class="subtle">/ 我的账号</span></strong><small id="gf-caption">访问令牌 · 最近验证于 10 分钟前</small></div><span class="status ok" id="gf-status">已连接</span><button class="icon-button" data-action="credentials" data-provider="gongfeng" aria-label="查看工蜂连接"><svg><use href="#i-arrow"/></svg></button></div></section>
<section class="stats" id="stats" aria-label="仓库统计"></section>
<section class="repository-panel" aria-label="仓库列表"><div class="toolbar"><label class="search"><svg><use href="#i-search"/></svg><input type="search" id="search" placeholder="搜索名称、组织路径或地址…" aria-label="搜索仓库"></label><select id="provider-filter" aria-label="筛选仓库来源"><option value="all">全部来源</option><option value="github">GitHub</option><option value="gongfeng">工蜂</option></select><select id="status-filter" aria-label="筛选连接状态"><option value="all">全部状态</option><option value="ok">正常</option><option value="pending">待验证</option><option value="error">连接失败</option></select></div><div class="table-head"><span>仓库</span><span>默认分支</span><span>连接状态</span><span>绑定项目</span><span></span></div><div id="repo-list"></div><footer class="list-footer"><span id="list-count"></span><span><svg><use href="#i-shield"/></svg>凭据加密保存，仓库列表不含令牌</span></footer></section>
<div class="execution-note"><svg><use href="#i-server"/></svg><div><strong>仓库决定代码来源，运行环境决定在哪里执行。</strong><p>远程任务按需拉取代码并创建独立 worktree；已有服务器目录可在项目中单独关联。</p></div><button data-action="local">关联本地目录 <svg><use href="#i-arrow"/></svg></button></div>
<details class="review-tools"><summary>设计状态预览</summary><div><label>页面状态<select id="scenario"><option value="normal">正常数据</option><option value="dense">密集 / 长名称</option><option value="empty">空仓库</option><option value="loading">加载中</option><option value="error">读取失败</option><option value="readonly">普通成员 / 只读</option><option value="unconfigured">平台尚未连接</option></select></label><button data-action="reset">重置交互数据</button></div></details>
</div></main></div>
<dialog id="drawer" class="drawer" aria-labelledby="drawer-title"><div id="drawer-content"></div></dialog>
<dialog id="modal" class="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body></html>
