# 自部署 Docker Compose — 启动 PostgreSQL、后端、前端。
#
# 服务仅绑 127.0.0.1。跨机器或公开访问时，前置反向代理
# （Caddy / nginx / Cloudflare Tunnel）终止 TLS 并转发到
# 127.0.0.1:8080（后端）与 127.0.0.1:3000（前端）。
# 不要把这些绑定改成 0.0.0.0——Docker 默认绕过主机防火墙
# （UFW/iptables），用默认 JWT_SECRET 与 Postgres 凭证的话原始端口会
# 直接暴露到互联网。见：
#   apps/docs/content/docs/self-host-quickstart.mdx
#
# 用法：
#   cp .env.example .env
#   # 编辑 .env——至少改 JWT_SECRET
#   docker compose -f docker-compose.selfhost.yml up -d
#
# 前端：http://localhost:${FRONTEND_PORT:-3000}
# 后端：http://localhost:${BACKEND_PORT:-8080}

name: multica

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multica}
      POSTGRES_USER: ${POSTGRES_USER:-multica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multica}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-multica} -d ${POSTGRES_DB:-multica}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${MULTICA_BACKEND_IMAGE:-ghcr.io/multica-ai/multica-backend}:${MULTICA_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/data/uploads
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-multica}:${POSTGRES_PASSWORD:-multica}@postgres:5432/${POSTGRES_DB:-multica}?sslmode=disable
      PORT: "8080"
      METRICS_ADDR: ${METRICS_ADDR:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-west-2}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      ATTACHMENT_DOWNLOAD_MODE: ${ATTACHMENT_DOWNLOAD_MODE:-auto}
      ATTACHMENT_DOWNLOAD_URL_TTL: ${ATTACHMENT_DOWNLOAD_URL_TTL:-30m}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN:-}
      CLOUDFRONT_KEY_PAIR_ID: ${CLOUDFRONT_KEY_PAIR_ID:-}
      CLOUDFRONT_PRIVATE_KEY: ${CLOUDFRONT_PRIVATE_KEY:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      APP_ENV: ${APP_ENV:-production}
      MULTICA_APP_URL: ${MULTICA_APP_URL:-http://localhost:3000}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ALLOWED_ACCOUNTS: ${ALLOWED_ACCOUNTS:-}
      DISABLE_WORKSPACE_CREATION: ${DISABLE_WORKSPACE_CREATION:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # API 从公网可达的公开 URL，无尾斜杠。用于为 autopilot webhook
      # 触发器铸造绝对 webhook URL。在 same-origin 反向代理之后
      # （如纯 localhost 开发）留空；那种情况下前端会用
      # window.origin + webhook_path 组合 URL。刻意不用 header 派生该值，
      # 避免代理未加固时的 Host / X-Forwarded-Host 欺骗。
      MULTICA_PUBLIC_URL: ${MULTICA_PUBLIC_URL:-}
      # 逗号分隔的 CIDR，允许其源 IP 为 webhook per-IP 限流器设置
      # X-Forwarded-For / X-Real-IP。空默认 = 忽略 header，用 RemoteAddr。
      # 如 same-host 反向代理用 "127.0.0.1/32"。
      MULTICA_TRUSTED_PROXIES: ${MULTICA_TRUSTED_PROXIES:-}
      # 飞书 / Lark 机器人集成。MULTICA_LARK_SECRET_KEY 是启用开关：
      # 未设 = 集成禁用。国内飞书与国际 Lark 按安装自动检测，并存服务，
      # 所以两个 base-URL 旋钮通常留空。它们是可选的部署级覆盖，强制
      # 每个安装走单一 host（代理 / mock / 单云 staging）。从用过
      # https://open.larksuite.com 的设置升级？server 首次启动会把已有
      # 安装重标为 region=lark，之后可清空。见 docs/lark-bot-integration。
      MULTICA_LARK_SECRET_KEY: ${MULTICA_LARK_SECRET_KEY:-}
      MULTICA_LARK_HTTP_BASE_URL: ${MULTICA_LARK_HTTP_BASE_URL:-}
      MULTICA_LARK_CALLBACK_BASE_URL: ${MULTICA_LARK_CALLBACK_BASE_URL:-}
    restart: unless-stopped

  frontend:
    image: ${MULTICA_WEB_IMAGE:-ghcr.io/multica-ai/multica-web}:${MULTICA_IMAGE_TAG:-latest}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
    restart: unless-stopped

volumes:
  pgdata:
  backend_uploads:
