version: "2"
sql:
  - engine: "postgresql"
    queries: "pkg/db/queries/"
    schema:
      - "migrations/000_initial_schema.up.sql"
      - "migrations/686_delivery_batch_project.up.sql"
      - "migrations/687_release_agent_config.up.sql"
      - "migrations/688_release_agent_config_workspace.up.sql"
      - "migrations/689_release_agent_identity.up.sql"
      - "migrations/690_pending_release_status.up.sql"
      - "migrations/691_delivery_auto_release.up.sql"
      - "migrations/692_openviking_event.up.sql"
      - "migrations/693_openviking_event_id.up.sql"
      - "migrations/694_openviking_event_pending.up.sql"
      - "migrations/695_openviking_chat_session.up.sql"
    gen:
      go:
        package: "db"
        out: "pkg/db/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
