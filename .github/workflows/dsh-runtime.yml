name: DSH runtime
on:
  push:
    branches: [personal-studio-upstream]
    paths: ['packages/dsh-runtime/**', 'server/pkg/agent/dsh*', 'server/pkg/dshprofile/**', 'server/internal/daemon/dsh*', 'server/internal/daemon/dshbundle/**', 'server/internal/daemon/agents*', 'server/internal/daemon/daemon.go', 'scripts/*release*', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/dsh-runtime.yml']
  pull_request:
    paths: ['packages/dsh-runtime/**', 'server/pkg/agent/dsh*', 'server/pkg/dshprofile/**', 'server/internal/daemon/dsh*', 'server/internal/daemon/dshbundle/**', 'server/internal/daemon/agents*', 'server/internal/daemon/daemon.go', 'scripts/*release*', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/dsh-runtime.yml']
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '~1.26.10'
          cache-dependency-path: server/go.sum
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @multica-ai/dsh-runtime check
      - run: pnpm --filter @multica-ai/dsh-runtime bundle:daemon
      - run: git diff --exit-code -- server/internal/daemon/dshbundle/bundle
      - run: pnpm --filter @multica-ai/dsh-runtime pack:runtime
      - working-directory: server
        run: bash ../scripts/go-test-with-agent-cli-guard.sh go test ./pkg/agent ./pkg/dshprofile ./internal/daemon ./internal/daemon/dshbundle -run '^Test(Dsh|EmbeddedBridge)' -count=1
      - run: python3 scripts/dsh-runtime-release.test.py
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-runtime
          path: packages/dsh-runtime/artifacts/
  windows-admission:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: '~1.26.10'
          cache-dependency-path: server/go.sum
      - working-directory: server
        run: go test ./pkg/dshprofile ./pkg/agent -run '^TestDsh(Managed|Shared|Generation|Artifact|Supported)' -count=1
