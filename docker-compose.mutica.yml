name: mutica

services:
  backend:
    image: mutica-backend:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_BASE_IMAGE: ${GO_BASE_IMAGE:-golang:1.26-alpine}
        ALPINE_BASE_IMAGE: ${ALPINE_BASE_IMAGE:-alpine:3.21}
        VERSION: mutica-local
        COMMIT: local
        DATE: local
    ports:
      - "127.0.0.1:${MUTICA_BACKEND_PORT:-33180}:8080"
    volumes:
      - mutica_uploads:/app/data/uploads
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_ENV: ${APP_ENV}
      MULTICA_APP_URL: ${MULTICA_APP_URL}
      MULTICA_PUBLIC_URL: ${MULTICA_PUBLIC_URL}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP}
      DISABLE_WORKSPACE_CREATION: ${DISABLE_WORKSPACE_CREATION}
      LOCAL_UPLOAD_DIR: /app/data/uploads
      ATTACHMENT_DOWNLOAD_MODE: proxy
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-2592000}
    restart: unless-stopped

  frontend:
    image: mutica-web:local
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
        REMOTE_API_URL: http://backend:8080
        NEXT_PUBLIC_WS_URL: ""
        NEXT_PUBLIC_APP_VERSION: mutica-local
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${MUTICA_FRONTEND_PORT:-33080}:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    restart: unless-stopped

volumes:
  mutica_uploads:
