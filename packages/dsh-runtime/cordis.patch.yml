# Private Multica runtime surface over dsh-base. It intentionally exposes no
# HTTP listener and disables DSH telemetry so private task content never leaves
# the machine except through the explicitly selected model and MCP providers.

- id: hmr
  disabled: true

- id: session-telemetry-otel
  disabled: true

- id: session-persistence-jsonl
  config:
    root: !!js process.env.MULTICA_DSH_SESSION_ROOT ?? dshHomePath('sessions')

# DSH 0.2 renamed `persona` to `personaPrefix` and removed the `{{cwd}}`
# variable; the working-directory service now injects the directory itself.
- id: system-prompt
  config:
    personaPrefix: !!js >-
      process.env.MULTICA_DSH_INTERACTIONS === '1'
        ? 'You are a coding agent powered by the {{model}} model and running for Multica. Ask user-owned questions with ask_user_question. Submit plans through exit_plan_mode; wait for the user decision before implementation.'
        : 'You are a coding agent powered by the {{model}} model and running for Multica. This runtime is headless: do not call ask_user_question. When a genuinely user-owned decision blocks progress, explain the decision and available options in your final response.'

# Multica 已维护聊天标题，关闭重复的原生标题模型请求。
- id: session-title-llm
  disabled: true

- insert:
    # DSH's launcher treats this reserved row id as a one-shot surface. The
    # bridge owns process lifetime through appExit, so profile HMR/watchers
    # must never race its shutdown after a result is emitted.
    - id: multica-tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
      disabled: !!js process.env.MULTICA_DSH_INTERACTIONS !== '1'
    - id: headless-runner
      name: '@multica-ai/dsh-runtime'

# Keep the working set bounded for Multica tasks. DSH ships compaction defaults
# (0.8 of the window, 64k headroom); 0.7 plus an explicit retention budget makes
# long tasks compact earlier, which keeps DeepSeek prefix-cache reads and
# per-call latency lower. The bridge still reports each compaction as an event.
- id: compaction-basic
  config:
    thresholdRatio: 0.7
    retainTokens: 32768
    maxTokens: 16384

# 受管 profile 的默认模型走 CodeBuddy 额度：canary 与未显式选模型的 DSH agent 不需要
# 官方 DeepSeek 凭据；显式设置模型的 agent 不受影响。
- id: agent-default-model
  config:
    provider: codebuddy
    model: deepseek-v4.1-flash
